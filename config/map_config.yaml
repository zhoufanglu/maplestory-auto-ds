# ============================================================================
# 地图配置：按地图名分组，每组是该地图的 minimap 坐标 与 monster_detect 配置
# 用法：在 config/config_custom.yaml 的 bot.map 填地图名，启动时自动加载对应配置
# （深合并进全局配置：地图里没写的字段，回退用 config_custom / config_default 的默认值）
# ============================================================================

duoluozhuyi:                        # 堕落主义
  minimap:
    x: 23
    y: 130
    width: 122
    height: 106
    width_boundary_pct: 0.6         # 黄线边界：角色只能在中部这个比例内移动（0=关闭）
  attack_in_area:
    is_attack_in_area: false        # 攻击区域开关：true=角色限制在下方矩形内（绿色虚线）
    x: 0                             # 矩形左上角 x（相对小地图左上角）
    y: 0                             # 矩形左上角 y
    width: 0                         # 矩形宽（0=不生效）
    height: 0                        # 矩形高
    screen_scale: 0                 # 主画面投影缩放：0=自动估算（游戏画面宽/小地图宽），或手动指定
  monster_detect:
    # 每个怪物文件夹单独配置：diff_thres / scales
    # （没单独配的属性，回退用本图 monster_detect.diff_thres / scales）
    monsters:
      zhang_yu:
        diff_thres: 0.302
        scales: [1.1, 1.2]
      lan_mo_gu:
        diff_thres: 0.20
        scales: [1.1]
    diff_thres: 0.25                # 本图全局默认匹配阈值 0.0~1.0（越小越严格）
    scales: [1.1]                   # 本图全局默认缩放比例数组

 # 东部4
