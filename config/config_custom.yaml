bot:
  mode: "hunt" # detect = 只检测不攻击, hunt = 路线挂机
  attack: "directional"
  map: "duoluozhuyi" #duoluozhuyi dongbu3
  enable_route: true
  warning: true               # 测谎报警开关 true=开 false=关

system:
  fps_limit_main: 30

warning_monitor:
  interval_seconds: 1.0
  
key:
  directional_attack: "x"
  aoe_skill: "a"
  add_hp: "end"
  add_mp: "home"
  pickup: "z"                 # 拾取键
  jump_hold_up_seconds2: 2.0   # 按跳跃键时同时按住 up 的时长（秒），抓绳用；0=关闭

pickup:
  enable: true                # 移动时自动拾取
  cooldown: 0.3               # 拾取按键间隔（秒）

buff_skill:
  keys: ["2"]                # 自动加的 buff 技能键
  cooldown: [120]            # 每个键的冷却时间（秒），顺序和 keys 一致
  action_cooldown: 1         # 放完 buff 后延迟多久再继续别的动作（秒）
  freeze_seconds: 1.5        # 放 buff 时停止攻击/移动，人物冻结这么久（秒）
  startup_delay: 2           # 脚本启动后延迟多久才执行第一次 buff（秒）

title:
  enable: true
  mode: "grayscale"           # 当前这张 title.png 建议先用 grayscale；如果现场干扰多再切 white_mask
  manual_select: true          # 在监视器窗口里点击称号候选框，手动锁定自己的角色
  max_candidates: 1
  candidate_threshold: 0.15
  lock_miss_tolerance: 18
  manual_track_radius: 180
  manual_track_threshold: 0.30
  offset: [0, -60]
  match_threshold: 0.28        # 先收紧一点，减少误匹配；若经常 MISS 可放宽到 0.28~0.30
  cache_ttl: 30                # 更频繁重搜，降低锁到错误 UI 文本的概率
  prev_search_radius: 180      # 优先在上次位置附近找，减少吸到其他玩家
  center_search_radius: 320    # 只在屏幕中部较大范围内做中心候选搜索
  center_accept_radius: 900    # 超出中心太远的候选直接拒绝（调大，允许称号在屏幕任意位置）
  max_jump_px: 900             # 新候选离上次位置太远时拒绝切换（调大，允许称号自由跳变）
  stick_to_prev_margin: 0.03   # 新候选没有明显更优时，继续沿用上次锁定
  strong_match_threshold: 0.06 # 只有特别强的匹配才允许替换当前锁定
  white_lower: 185             # white_mask 模式备用参数
  white_upper: 255
  blur_kernel: 3

appearance:
  enable: true                    # 用角色外观(fashi.png)辅助定位，防称号丢失/冲突
  template: "character/fashi.png"
  search_radius: 140              # 在上次角色位置附近搜索外观的半径(像素)
  center_fallback_radius: 260     # 无历史位置时围绕屏幕中心搜索
  match_threshold: 0.85           # CCORR_NORMED 相关度阈值 0~1，>=0.85 用外观，<0.85 用称号
  hold_frames: 20                 # 外观短暂丢失(如攻击动画)时，沿用上次外观位置多少帧再回退称号
  gate_radius: 90                 # 称号位置与外观位置差超过此值，改用外观定位
  feet_offset: [0, -6]            # 外观模板底部中心 → 脚底偏移 [x, y]
#  这个是魔法密林 北部2的 位置 先存下
#  x: 10
#  y: 149
#  width: 189
#  height: 144
############################
minimap:
 #fixed: true                    # true=用下面固定坐标(不自动白框检测)，窗口大小固定时更准
  # dongbu3
#  x: 17
#  y: 130
#  width: 166
#  height: 149
  # 堕落主义
  x: 23
  y: 130
  width: 122
  height: 106
  player_color: [136, 255, 255]   # 玩家小黄点 BGR (#ffff88 → 136,255,255)
  player_tolerance: 8            # 颜色容差起始值（会自动扩大到+30）
  player_max_jump_px: 30         # 新检测点离上次位置超过此距离就不更新（防跳到传送门等静止标记）
  dot_stuck_seconds: 3.0         # 绿点超过多少秒没动就重置重新定位（0=关闭）
  width_boundary_pct: 0.6        # 角色只能在中部这个比例(30%~70%)内移动，0=关闭

monster_detect:
  # 每个怪物文件夹单独配置：diff_thres / scales / min_color_spread
  # （没单独配的属性，回退用下面全局的 diff_thres / scales / min_color_spread）
  monsters:
    zhang_yu:
      diff_thres: 0.302
      scales: [1.1, 1.2]
    lan_mo_gu:
        diff_thres: 0.20
        scales: [1.1]
#    fu_mu_yao:
#      diff_thres: 0.42
#      scales: [1.1, 1.2]
#    black_axe_stump:
#      diff_thres: 0.44
#      scales: [1.1, 1.2]
#      min_color_spread: 0      # 暗色怪物纯度低，单独调低（默认30会把它过滤掉）
#      OrangeMushroom2:
#      diff_thres: 0.22z
#      scales: [1.1]
  mode: "color"                     # colaor / grayscale / contour_only
  diff_thres: 0.25            # 全局默认匹配阈值 0.0~1.0（越小越严格）
  scales: [1.1]                 # 全局默认缩放比例数组 [0.5~1.5]
  display_scale: 0.47               # 监视器缩放 0.1~1.0（越小越流畅）0.47
  detection_interval: 2             # 每N帧检测一次 1~5（1=每帧，越大越流畅）
  with_enemy_hp_bar: true           # 通过怪物血条辅助检测（防掉落物遮挡）
  hp_bar_color: [0, 255, 0]         # 怪物血条 BGR 颜色（绿色）
  hp_bar_tolerance: 30              # 颜色容差（实际是0,243,0，容差30能匹配到）
  min_color_spread: 30              # 颜色纯度下限（过滤灰色云朵等中性色误识别）

directional_attack:
  attack_in_place: false            # 原地攻击：不移动持续攻击（刷固定点用）
  range_x: 300                     # 水平攻击范围（像素）——左右距离，调大打得远
  range_y: 40                      # 垂直攻击范围（像素）——上下距离
  face_tap_duration: 0.3           # 转身点按时长（秒），太短游戏识别不到会打反方向
  face_deadzone_px: 50             # 怪物离玩家多近就停步攻击（像素），朝怪物走时用到
  attack_move_interval: 3          # 连续攻击多少次后，朝怪物方向移动一下
  attack_move_seconds: 0.3         # 移动时长（秒）
  aoe_monster_count: 3             # 识别怪物>=此数量时使用群攻
  in_place_aoe_idle_seconds: 3.0   # 原地攻击时，多少秒没怪就放一次群攻(爆炸箭)
  in_place_walk_interval_seconds: 30    # 原地攻击时每隔多少秒走动一次
  in_place_walk_seconds: 0.30           # 向右走多少秒
  in_place_walk_back_seconds: 0.32      # 向左走多少秒
  in_place_stop_attack_seconds: 0.7    # 移动前后各停多少秒
  in_place_walk_dir: "right"        # 固定起始方向：right=先右 / left=先左
  search_attack_while_move: false   # 找怪时不攻击，避免停步
  search_flip_frames: 4800            # 每方向走480帧（约16秒@30fps）
  search_max_offset_px: 10000          # 单边最远走600px（翻倍）
  search_stall_frames: 0             # 0=关闭stall检测（无路线时小地图动太慢会误判卡住）
  search_stall_min_delta_px: 0       # 同上，关掉。范围全靠 search_flip_frames 控制
  search_random_jump_chance: 0.03   # 找怪时随机跳跃概率（每帧），0=关闭
  search_random_jump_cd: 45         # 跳跃冷却帧数，避免连跳

route:
  search_range: 30                    # 搜索最近路线颜色的半径（像素），调大能跨过路线小缺口
  miss_grace_frames: 30               # 找不到路线颜色时，保持上一步移动多少帧再停（桥接缺口）
  climb_y_offset: 0.5                 # 爬梯Y偏移量（像素），改小=梯子更短
  climb_y_interval: 5             # 每N帧偏移一次，改大=梯子更短
  climb_complement_dist: 3            # 爬梯时横向/垂直互补的距离上限（像素），防止竖直梯被远处无关颜色带偏方向

stuck_recovery:
  enable: true                        # 跟路线时原地卡住自动脱离
  timeout_seconds: 3.0                # 原地未移动多久判定为卡住（秒）
  unstick_seconds: 2.0                # 卡住后往左走多久（秒）

health_monitor:
  enable: true
  enable_hp: true                  # HP 自动喝药开关（F2 切换）
  enable_mp: true                  # MP 自动回蓝开关（F3 切换）
  bar_count: 2                     # 083版本可能只有HP+MP两个条，没有EXP条
  # 固定坐标定位（游戏更新后 UI 血条位置固定，白框检测会漏识别半满条）
  fixed_bars: true
  hp_bar_rect: [586, 970, 209, 23]   # HP 血条 [x, y, w, h]（基于 1710x1000 窗口）
  mp_bar_rect: [795, 970, 208, 23]   # MP 蓝条 [x, y, w, h]（基于 1710x1000 窗口）
  bar_white_thresh: 200            # 降低阈值以匹配灰色/暗色边框
  bar_min_aspect: 2.0              # 放宽宽高比范围
  bar_max_aspect: 15.0
  bar_min_area: 500                # 放宽面积范围
  bar_max_area: 12000
  bar_min_width: 110               # 过滤掉过窄/过宽的白框（防止识别到其他UI）
  bar_max_width: 180
  bar_min_height: 16
  bar_max_height: 24
  add_hp_percent: 50
  add_mp_percent: 10
  hp_rearm_percent: 54          # 回到该值以上才视为本轮回血完成
  mp_rearm_percent: 12          # 回到该值以上才视为本轮回蓝完成
  hp_retry_timeout: 2.0         # 持续低血时，2秒后允许再喝一瓶
  mp_retry_timeout: 1.5         # 持续低蓝时，1.5秒后允许再喝一瓶
  warmup_reads: 15              # 启动后前N次有效读数不喝药（防止首帧未渲染误判0%）

ui_coords:
  ui_y_start: 610                   # 根据实际游戏窗口调整：底部UI栏Y起点
