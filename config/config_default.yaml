# ============================================================================
# MapleStory Auto Detection — 默认配置
# ============================================================================
# 游戏窗口: "MapleStoryGo"
# 自定义覆盖请写到 config/config_custom.yaml
# ============================================================================

# ---------------------------------------------------------------------------
# 机器人设置
# ---------------------------------------------------------------------------
bot:
  mode: "detect"          # "detect" = 仅检测并可视化, "hunt" = 路线挂机
  attack: "directional"   # "directional" (方向攻击) 或 "aoe_skill" (范围攻击)
  map: ""                 # 地图名称（可选）
  enable_route: false     # 是否启用路线跟随

# ---------------------------------------------------------------------------
# 键盘按键绑定
# ---------------------------------------------------------------------------
key:
  jump: "alt"
  jump_hold_up_seconds: 2.0    # 按跳跃键时同时按住 up 的时长（秒），抓绳用；0=关闭
  aoe_skill: "q"
  directional_attack: "w"
  teleport: "e"
  add_hp: "end"              # HP药水快捷键
  add_mp: "home"             # MP药水快捷键
  return_home: "home"       # 回城卷轴快捷键

# ---------------------------------------------------------------------------
# 游戏窗口设置
# ---------------------------------------------------------------------------
game_window:
  title: "冒险岛怀旧服"        # 窗口标题（部分匹配）
  size: [693, 1282]            # 期望窗口尺寸 (高度, 宽度)
  title_bar_height: 0          # 标题栏裁剪高度
  ratio_tolerance: 0.08        # 16:9 比例容差

# ---------------------------------------------------------------------------
# 角色设置
# ---------------------------------------------------------------------------
character:
  width: 100            # 角色碰撞框宽度（像素）
  height: 150           # 角色碰撞框高度（像素）

# ---------------------------------------------------------------------------
# 角色标题识别（用于定位玩家位置）
# ---------------------------------------------------------------------------
title:
  enable: true               # 是否启用标题识别
  mode: "grayscale"         # grayscale = 灰度直接匹配；white_mask = 白色二值化匹配
  manual_select: true        # 是否允许在监视器窗口中点击候选称号手动锁定角色
  max_candidates: 6          # 最多显示多少个称号候选框
  candidate_threshold: 0.32  # 候选显示阈值（可比 match_threshold 略宽）
  lock_miss_tolerance: 15    # 手动锁定后允许连续丢失多少帧再解锁
  manual_track_radius: 180   # 手动锁定后，在该半径内继续跟踪所选称号
  manual_track_threshold: 0.32 # 手动锁定跟踪阈值
  offset: [0, -60]           # 标题→角色位置的像素偏移 [x, y]
  white_lower: 150           # 白色二值化下限 (0-255)，越低提取越多偏灰像素
  white_upper: 255           # 白色二值化上限
  match_threshold: 0.3       # SQDIFF 匹配阈值 (0-1)，越小越严格，score低于此值视为匹配成功
  blur_kernel: 3             # 高斯模糊核大小，奇数

# ---------------------------------------------------------------------------
# 怪物检测设置
# ---------------------------------------------------------------------------
monster_detect:
  monsters: []               # 指定怪物文件夹，空=扫描monster/下全部。示例: ["black_axe_stump", "OrangeMushroom"]
  mode: "color"              # 检测模式: "color" / "grayscale" / "contour_only" / "template_free"
  diff_thres: 0.10           # SQDIFF_NORMED 阈值（越小越严格）
  scales: [1.0]              # 缩放比例数组，官方素材和游戏分辨率不匹配时加多个比例
                             #   示例: [0.7, 0.85, 1.0, 1.15, 1.3] 覆盖更大范围
                             #   只设 [1.0] = 单尺度，性能最好
  max_mob_area_trigger: 5000 # 触发攻击的最大怪物面积
  search_box_margin: 50      # 搜索框额外边距
  contour_blur: 5            # 高斯模糊核大小（仅 contour_only 模式）
  with_enemy_hp_bar: false   # 是否通过怪物血条辅助检测
  hp_bar_color: [0, 255, 0]  # 怪物血条 BGR 颜色
  display_scale: 0.55        # 监视器缩放比例 (0.3~1.0)
  detection_interval: 2      # 每隔 N 帧执行检测（1=每帧检测）

# ---------------------------------------------------------------------------
# 方向攻击设置
# ---------------------------------------------------------------------------
directional_attack:
  range_x: 600           # 水平攻击范围（像素）
  range_y: 70            # 垂直攻击范围（像素）
  cooldown: 0.9          # 攻击冷却时间（秒）
  search_enabled: true   # hunt模式且没怪时，是否左右移动找怪
  search_trigger_frames: 4   # 连续多少帧没怪后开始左右搜索
  search_flip_frames: 18      # 每多少帧切换一次左右方向
  search_attack_while_move: true # 搜索移动中是否继续按攻击键
  search_stall_frames: 8       # 连续多少帧几乎没水平位移，视为顶墙/卡住
  search_stall_min_delta_px: 1.0 # 最小水平位移阈值（优先使用小地图坐标）
  search_max_offset_px: 45     # 单边最多离开搜索起点多远，超出就反向；0=不限制
  search_max_sweeps: 0         # 搜索换向次数上限，0=不限制
  search_pause_frames: 12      # 达到上限后暂停多少帧再继续

# ---------------------------------------------------------------------------
# 范围技能设置
# ---------------------------------------------------------------------------
aoe_skill:
  range_x: 400           # 水平 AoE 范围（像素）
  range_y: 170           # 垂直 AoE 范围（像素）
  cooldown: 1.0          # AoE 技能冷却时间（秒）

# ---------------------------------------------------------------------------
# 系统设置
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 路线录制
# ---------------------------------------------------------------------------
route_recoder:
  blob_cooldown: 0.7            # 跳跃/传送标记冷却时间（秒）
  map_padding: 30               # 拼接地图的黑色边距（像素）

# ---------------------------------------------------------------------------
# 路线导航颜色
# ---------------------------------------------------------------------------
route:
  search_range: 10              # 搜索最近路线颜色的半径（像素）
  climb_y_offset: 1             # 爬梯每N帧Y偏移量（像素），改小=梯子更短
  climb_y_interval: 15          # 每N帧偏移一次，改大=梯子更短
  climb_complement_dist: 3      # 爬梯时横向/垂直互补的距离上限（像素），防止竖直梯被远处无关颜色带偏方向
  color_code:
    "255,0,0": "left none none"         # 红: 向左走
    "0,0,255": "right none none"        # 蓝: 向右走
    "255,127,0": "left none jump"       # 橙: 向左跳
    "0,255,255": "right none jump"      # 青: 向右跳
    "127,255,0": "none down jump"       # 绿: 向下跳
    "255,0,255": "none none jump"       # 紫: 原地跳
    "0,255,127": "stop stop stop"       # 浅绿: 停止
    "255,255,0": "none none goal"       # 黄: 目标点
    "255,0,127": "none up teleport"     # 粉: 向上N传送
    "127,0,255": "none down teleport"   # 紫红: 向下传送
    "0,127,0": "left none teleport"     # 深绿: 向左传送BN
    "139,69,19": "right none teleport"  # 棕: 向右传送
  color_code_up_down:
    "127,127,127": "none up none"       # 灰: 向上爬
    "255,255,127": "none down none"     # 浅黄: 向下爬

# ---------------------------------------------------------------------------
# 系统设置
# ---------------------------------------------------------------------------
system:
  fps_limit_main: 10                # 主循环 FPS 上限
  fps_limit_window_capturor: 15     # 窗口截取线程 FPS 上限
  fps_limit_route_recorder: 10      # 路线录制器 FPS 上限
  server: "TW"                      # 服务器: "TW" / "NA"
  language: "cn"                    # 语言: "cn" / "eng"

# ---------------------------------------------------------------------------
# 告警监控（warning/warning.py）
# ---------------------------------------------------------------------------
warning_monitor:
  enable: true                      # 是否启用测谎/报警监控线程
  interval_seconds: 1.0             # 轮询间隔（秒）

# ---------------------------------------------------------------------------
# HP/MP 自动回复
# ---------------------------------------------------------------------------
health_monitor:
  enable: true                     # 是否启用自动喝药
  enable_hp: true                  # HP 自动喝药开关（F2 切换）
  enable_mp: true                  # MP 自动回蓝开关（F3 切换）
  force_heal: false                # 优先回血（暂停攻击直到血量恢复）
  add_hp_percent: 50               # HP 低于此百分比就喝药 [0-100]
  add_mp_percent: 10               # MP 低于此百分比就喝药 [0-100]
  hp_rearm_percent: 55             # 回到该值以上才视为本轮回血完成
  mp_rearm_percent: 15             # 回到该值以上才视为本轮回蓝完成
  hp_retry_timeout: 2.0            # 持续低血时，超时后允许再喝一瓶
  mp_retry_timeout: 1.5            # 持续低蓝时，超时后允许再喝一瓶
  add_hp_cooldown: 0.5             # 喝 HP 药水冷却时间（秒）
  add_mp_cooldown: 0.5             # 喝 MP 药水冷却时间（秒）
  fps_limit: 20                    # 监控线程 FPS
  return_home_if_no_potion: false  # 药水耗尽时自动回城
  return_home_watch_dog_timeout: 3 # 持续低血量多少秒触发回城
  # --- 血条/蓝条检测参数 ---
  bar_count: 3                     # 检测几个条（3=HP+MP+EXP, 2=仅HP+MP）
  bar_white_thresh: 240            # 白色边框提取阈值 (0-255)，调低可匹配灰框
  bar_min_aspect: 2.5              # 条的最小宽高比（w/h），值越小越宽松
  bar_max_aspect: 12.0             # 条的最大宽高比
  bar_min_area: 800                # 条的最小面积（像素）
  bar_max_area: 8000               # 条的最大面积（像素）

# ---------------------------------------------------------------------------
# UI 坐标（血条/蓝条位置）
# ---------------------------------------------------------------------------
ui_coords:
  ui_y_start: 610                  # 底部 UI 栏的 Y 起始坐标（血条区域从此处开始）
